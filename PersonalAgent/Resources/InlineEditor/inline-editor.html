<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/*
  CM6 live-preview 编辑器壳。
  全部配色用 CSS 变量集中管理，明暗双套；bundle.mjs 里 EditorView.theme
  和高亮 class 都通过 var(--md-*) 引用。
  调色板取自 GitHub Markdown（Light/Dark）—— 兼顾读感、稳态对比度和长
  时间写作不刺眼。
*/
:root {
  color-scheme: light dark;

  /* ===== Light（默认） ===== */
  --md-fg:            #1f2328;  /* 正文 */
  --md-fg-muted:      #57606a;  /* 二级文本（备注、标记淡化） */
  --md-heading:       #1a1a1a;  /* 标题主色 */
  --md-h1-border:     rgba(0,0,0,.08);
  --md-h2-border:     rgba(0,0,0,.07);

  --md-strong:        #111418;
  --md-em:            #2f3640;

  --md-link:          #0969da;
  --md-wikilink:      #6f42c1;
  --md-link-decoration: underline;

  --md-code-fg:       #d73a49;
  --md-code-bg:       rgba(175,184,193,.22);
  --md-code-border:   rgba(175,184,193,.30);

  --md-quote-fg:      #57606a;
  --md-quote-bg:      rgba(208,215,222,.18);
  --md-quote-border:  #d0d7de;

  --md-hr:            #d0d7de;
  --md-table-border:  rgba(208,215,222,.6);

  --md-mark-soft:     rgba(0,0,0,.28);   /* 标记淡化（光标在节点内） */
  --md-selection:     rgba(0,122,255,.22);
  --md-active-line:   rgba(0,0,0,.025);

  --cm-caret:         #007aff;

  /* —— code block syntax 高亮（GitHub Light） —— */
  --tok-keyword:      #cf222e;
  --tok-string:       #0a3069;
  --tok-number:       #0550ae;
  --tok-atom:         #0550ae;
  --tok-comment:      #6e7781;
  --tok-variable:     #953800;
  --tok-function:     #8250df;
  --tok-type:         #0550ae;
  --tok-url:          #0969da;
}

@media (prefers-color-scheme: dark) {
  :root {
    --md-fg:            #c9d1d9;
    --md-fg-muted:      #8b949e;
    --md-heading:       #e6edf3;
    --md-h1-border:     rgba(255,255,255,.08);
    --md-h2-border:     #30363d;

    --md-strong:        #f0f6fc;
    --md-em:            #c9d1d9;

    --md-link:          #58a6ff;
    --md-wikilink:      #bc8cff;

    --md-code-fg:       #ffa198;
    --md-code-bg:       rgba(110,118,129,.38);
    --md-code-border:   rgba(110,118,129,.48);

    --md-quote-fg:      #8b949e;
    --md-quote-bg:      rgba(110,118,129,.10);
    --md-quote-border:  #3b434b;

    --md-hr:            #30363d;
    --md-table-border:  rgba(110,118,129,.4);

    --md-mark-soft:     rgba(255,255,255,.32);
    --md-selection:     rgba(56,139,253,.35);
    --md-active-line:   rgba(255,255,255,.04);

    --cm-caret:         #58a6ff;

    /* GitHub Dark Dimmed code colors */
    --tok-keyword:      #ff7b72;
    --tok-string:       #a5d6ff;
    --tok-number:       #79c0ff;
    --tok-atom:         #79c0ff;
    --tok-comment:      #8b949e;
    --tok-variable:     #ffa657;
    --tok-function:     #d2a8ff;
    --tok-type:         #79c0ff;
    --tok-url:          #58a6ff;
  }
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: transparent;
  color: var(--md-fg);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-text-size-adjust: 100%;
}

#editor {
  position: absolute;
  inset: 0;
}
.cm-editor {
  height: 100%;
  background: transparent !important;
  color: var(--md-fg);
}
.cm-editor.cm-focused {
  outline: none !important;
}
.cm-editor .cm-gutters {
  display: none !important;           /* 不要行号沟槽，纯写作视图 */
}

/* —— 选区配色：覆盖 CM6 默认 —— */
.cm-editor .cm-selectionBackground,
.cm-editor ::selection {
  background: var(--md-selection) !important;
}
.cm-editor.cm-focused .cm-selectionBackground {
  background: var(--md-selection) !important;
}

/* —— 当前活动行底色 —— */
.cm-editor .cm-activeLine {
  background-color: var(--md-active-line) !important;
}

/* —— code block 内 syntax token class（HighlightStyle 用 class 模式） —— */
.tok-keyword  { color: var(--tok-keyword);  font-weight: 600; }
.tok-string   { color: var(--tok-string);   }
.tok-number   { color: var(--tok-number);   }
.tok-atom     { color: var(--tok-atom);     }
.tok-comment  { color: var(--tok-comment);  font-style: italic; }
.tok-variable { color: var(--tok-variable); }
.tok-function { color: var(--tok-function); font-weight: 500; }
.tok-type     { color: var(--tok-type);     }
.tok-url      { color: var(--tok-url); text-decoration: underline; }

/* —— 状态遮罩（init 失败时露出） —— */
#status {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: rgba(127, 127, 127, .06);
  color: #999;
  font: 13px -apple-system, "SF Pro Text", sans-serif;
  padding: 20px;
  text-align: center;
}
#status.err { color: #c33; background: rgba(255, 200, 200, .4); }
</style>
</head>
<body>
<div id="status">加载中…</div>
<div id="editor"></div>

<script>
'use strict';
// —— 统一错误回报通道：JS 任何阶段挂掉都丢给 Swift os.Logger ——
var statusEl = document.getElementById('status');
function showStatus(text, isError) {
  if (!statusEl) return;
  statusEl.textContent = text;
  statusEl.style.display = 'flex';
  if (isError) statusEl.classList.add('err');
}
function hideStatus() {
  if (statusEl) statusEl.style.display = 'none';
}
function reportError(msg) {
  try {
    window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.swift &&
      window.webkit.messageHandlers.swift.postMessage({ type: 'error', msg: String(msg) });
  } catch (_) {}
  showStatus('JS 错误: ' + msg, true);
}
window.addEventListener('error', function (e) {
  reportError((e && e.message) || 'unknown error');
});
window.addEventListener('unhandledrejection', function (e) {
  reportError('promise: ' + ((e && e.reason && e.reason.message) || e.reason || 'unknown'));
});
showStatus('加载 CodeMirror…');

function b64decode(s) {
  return decodeURIComponent(escape(window.atob(s || '')));
}
</script>

<script src="cm6.bundle.js" onerror="reportError('cm6.bundle.js 加载失败')"></script>

<script>
'use strict';

if (typeof CM6 === 'undefined') {
  reportError('CM6 全局未定义 — bundle 没加载');
} else {
  showStatus('初始化编辑器…');
}

var view = null;
window.__lastSyncedDoc = '';

try {
  if (typeof CM6 !== 'undefined') {
    view = CM6.create({
      parent: document.querySelector('#editor'),
      doc: '',
      onChange: function (doc) {
        if (doc === window.__lastSyncedDoc) return;
        window.__lastSyncedDoc = doc;
        try {
          window.webkit.messageHandlers.swift.postMessage({
            type: 'change',
            md: doc
          });
        } catch (_) {}
      }
    });
    hideStatus();
  }
} catch (e) {
  reportError('init failed: ' + (e && e.message ? e.message : e));
}

// —— Swift 调用接口（桥协议不变） ——
window.__setMarkdown = function (b64) {
  if (!view) { reportError('setMarkdown before init'); return; }
  var md = b64decode(b64);
  if (md === window.__lastSyncedDoc) return;
  window.__lastSyncedDoc = md;
  try { CM6.setDoc(view, md); } catch (e) { reportError(e); }
};
window.__insertText = function (b64) {
  if (!view) return;
  try { CM6.insertAtCursor(view, b64decode(b64)); } catch (e) { reportError(e); }
};
window.__getMarkdown = function () {
  if (!view) return '';
  try { return CM6.getDoc(view); } catch (e) { return ''; }
};
window.__undo = function () { try { CM6.undo(view); } catch (e) {} };
window.__redo = function () { try { CM6.redo(view); } catch (e) {} };

// —— 暗色实时跟随 ——
try {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onSchemeChange = function () {
    if (view) try { CM6.setTheme(view, mq.matches ? 'dark' : 'light'); } catch (_) {}
  };
  if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
  else if (mq.addListener) mq.addListener(onSchemeChange);
} catch (_) {}

// —— Cmd+Click 打开链接 ——
// CM6 只语法着色 URL,DOM 里没有真正的 <a>,且 URL 常被切成多个高亮
// span。所以:① mousedown capture 抢先(早于 CM6 自己的 click 处理),
// ② caretRangeFromPoint 用点击坐标拿 Range, ③ 走到 .cm-line 用整行
// textContent 跑 URL 正则, ④ TreeWalker 累加 text node 长度把命中
// 位置算成行内绝对偏移。命中才 preventDefault,没命中放行不影响光标。
function offsetWithinLine(line, node, offset) {
  if (node === line) return offset;
  var walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT, null);
  var acc = 0;
  var n;
  while ((n = walker.nextNode())) {
    if (n === node) return acc + offset;
    acc += (n.nodeValue || '').length;
  }
  return -1;
}

document.addEventListener('mousedown', function (e) {
  if (!e.metaKey || e.button !== 0) return;
  if (typeof document.caretRangeFromPoint !== 'function') return;
  var rng = document.caretRangeFromPoint(e.clientX, e.clientY);
  if (!rng) return;
  var node = rng.startContainer;
  var line = (node.nodeType === Node.TEXT_NODE) ? node.parentElement : node;
  while (line && !(line.classList && line.classList.contains('cm-line'))) {
    line = line.parentElement;
  }
  if (!line) return;
  var lineText = line.textContent || '';
  var pos = offsetWithinLine(line, node, rng.startOffset);
  if (pos < 0) return;
  var re = /https?:\/\/[^\s)\]]+/g;
  var m;
  while ((m = re.exec(lineText)) !== null) {
    if (pos >= m.index && pos <= m.index + m[0].length) {
      try {
        window.webkit.messageHandlers.swift.postMessage({
          type: 'open-url', url: m[0]
        });
      } catch (_) {}
      e.preventDefault();
      e.stopPropagation();
      return;
    }
  }
}, true);

try {
  window.webkit.messageHandlers.swift.postMessage({
    type: 'ready',
    hasEditor: !!view
  });
} catch (_) {}
</script>
</body>
</html>
