<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light dark; }
body {
  font: -apple-system-body;
  font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  margin: 0; padding: 14px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  word-wrap: break-word;
}
h1,h2,h3,h4,h5,h6 { font-weight: 700; line-height: 1.3; margin: 1em 0 .5em; }
h1 { font-size: 1.7em; } h2 { font-size: 1.45em; } h3 { font-size: 1.25em; }
h4 { font-size: 1.1em; } h5,h6 { font-size: 1em; }
p { margin: .5em 0; }
ul,ol { padding-left: 1.5em; }
li { margin: .2em 0; }
blockquote {
  margin: .6em 0; padding: .2em .9em;
  border-left: 3px solid rgba(127,127,127,.45);
  color: rgba(127,127,127,1);
}
/* 代码块:等宽、原样保留空格/对齐(ASCII 图不被打散),横向滚动不换行 */
pre {
  background: rgba(127,127,127,.12);
  border-radius: 6px; padding: 12px;
  overflow-x: auto;
}
pre code {
  font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: .9em; white-space: pre; tab-size: 4;
}
code:not(pre code) {
  font-family: "SF Mono", ui-monospace, Menlo, monospace;
  font-size: .88em;
  background: rgba(127,127,127,.15);
  padding: .12em .35em; border-radius: 4px;
}
table { border-collapse: collapse; margin: .6em 0; display: block; overflow-x: auto; }
th,td { border: 1px solid rgba(127,127,127,.4); padding: 6px 10px; }
th { background: rgba(127,127,127,.12); }
hr { border: none; border-top: 1px solid rgba(127,127,127,.35); margin: 1em 0; }
a { color: #2f80ed; }
img { max-width: 100%; }
.empty { color: rgba(127,127,127,1); }
</style>
<link rel="stylesheet" href="highlight-github.min.css">
</head>
<body>
<div id="content"></div>
<script src="marked.min.js"></script>
<script src="highlight.min.js"></script>
<script>
// 内容由 Swift 经 window.__render(base64) 注入——不拼进 HTML,
// base64 传输避免引号/脚本注入;marked 默认转义 HTML(防 XSS)。
marked.setOptions({
  breaks: true,        // 单换行 → <br>,贴合笔记书写习惯
  gfm: true,
  highlight: function (code, lang) {
    try {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    } catch (e) { return code; }
  }
});
function b64decode(s) {
  return decodeURIComponent(escape(window.atob(s)));
}
window.__render = function (b64) {
  var md = b64 ? b64decode(b64) : "";
  var el = document.getElementById("content");
  if (!md.trim()) {
    el.innerHTML = '<div class="empty">（空草稿）</div>';
    return;
  }
  el.innerHTML = marked.parse(md);
  el.querySelectorAll('pre code').forEach(function (b) {
    try { hljs.highlightElement(b); } catch (e) {}
  });
};
</script>
</body>
</html>
